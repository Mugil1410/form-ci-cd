<!DOCTYPE html>
<html>
<head>
  <title>CI/CD Form</title>

  <!-- 🔥 Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
    }

    .card {
      margin-top: 60px;
      border-radius: 12px;
    }

    .error {
      color: red;
      margin-top: 10px;
    }

    .success {
      color: green;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="row justify-content-center">

    <div class="col-md-6">

      <div class="card shadow p-4">

        <h3 class="text-center mb-4">Registration Form v1.3</h3>

        <div id="message"></div>

        <input class="form-control mb-3" type="text" id="name" placeholder="Enter Name" />

        <input class="form-control mb-3" type="text" id="mobile" placeholder="Enter Mobile" />

        <input class="form-control mb-3" type="text" id="pan" placeholder="Enter PAN Number" />

        <button class="btn btn-primary w-100" type="button" onclick="submitForm()">
          Submit
        </button>

      </div>

    </div>

  </div>
</div>

<script src="app.js"></script>

<script>
  function submitForm() {

    const name = document.getElementById("name").value;
    const mobile = document.getElementById("mobile").value;
    const pan = document.getElementById("pan").value;

    const result = validateForm(name, mobile, pan);

    const messageDiv = document.getElementById("message");

    // 🔥 Clear old message
    messageDiv.innerHTML = "";

    if (result.valid) {

      messageDiv.innerHTML = `
        <div class="alert alert-success">
          ✅ ${result.message}
        </div>
      `;

      console.log("SUCCESS:", result.message);

    } else {

      messageDiv.innerHTML = `
        <div class="alert alert-danger">
          ❌ ${result.message}
        </div>
      `;

      console.log("ERROR:", result.message);

      // ⚠️ simulate “throw error style”
      throw new Error(result.message);
    }
  }
</script>

</body>
</html>
