<!DOCTYPE html>
<html>
<head>
    <title>CI/CD Selenium Form</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        input {
            width: 300px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }

        .success {
            color: green;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h2>Registration Form</h2>

    <div id="message"></div>

    <input type="text" id="name" placeholder="Enter Name">
    <br>

    <input type="text" id="mobile" placeholder="Enter Mobile">
    <br>

    <input type="text" id="pan" placeholder="Enter PAN Number">
    <br>

    <button id="submit" onclick="submitForm()">Submit</button>

    <script src="app.js"></script>

</body>
</html>
